# Rebuilds the ranking tables every month and publishes them on the `catalog` branch, where the
# extension's weekly update check downloads them (see lib/catalog.js).
# A source that fails keeps its previous data and shows up as a warning on the run.
name: Update ranking catalog

on:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if no table changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from the published catalog (fallback for failing sources)
        run: |
          if git fetch --depth 1 origin catalog 2>/dev/null; then
            for f in index sjr core lists; do git show "FETCH_HEAD:$f.json" > "data/$f.json"; done
            cp data/index.json /tmp/previous-index.json
            echo "Starting from catalog $(jq -r .generated data/index.json)"
          else
            echo "No catalog branch yet; starting from the tables in the repository"
          fi

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build tables
        run: uv run scripts/build_data.py

      - name: Check the matcher against the new tables
        run: node --test tests/*.test.js

      - name: Publish to the catalog branch
        run: |
          set -euo pipefail
          if [ -f /tmp/previous-index.json ] && [ "${{ inputs.force }}" != "true" ] \
             && [ "$(jq -S .files /tmp/previous-index.json)" = "$(jq -S .files data/index.json)" ]; then
            echo "No table changed; nothing to publish"
            exit 0
          fi
          out="$(mktemp -d)"
          cp data/index.json data/sjr.json data/core.json data/lists.json "$out/"
          cat > "$out/README.md" <<EOF
          # Ranking catalog

          Generated by the [Update ranking catalog](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/update-catalog.yml) workflow
          from \`${GITHUB_SHA}\` on $(date -u +%F). Do not edit: this branch is force-pushed on every update.
          EOF
          cd "$out"
          git init -q -b catalog
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Ranking catalog $(date -u +%F)"
          # Single-commit branch: old table versions are not kept, so the repository does not grow.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog
          echo "Published: $(jq -c '.files | map_values(.built)' index.json)"

      - name: Summary
        if: always()
        run: |
          if [ -f data/index.json ]; then
            {
              echo "### Ranking catalog"
              jq -r '.files | to_entries[] | "- \(.key): built \(.value.built), \(.value.bytes) bytes"' data/index.json
              jq -r 'if (.warnings | length) > 0 then "\n**Warnings (previous data kept):**\n" + (.warnings | map("- " + .) | join("\n")) else "" end' data/index.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
